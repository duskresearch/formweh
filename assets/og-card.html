<meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000}
  .og{width:1200px;height:630px;position:relative;overflow:hidden;
    background:radial-gradient(70% 60% at 88% -10%, rgba(63,207,94,.10), transparent 60%), #070809;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:#ECEEF0;padding:74px 80px;display:flex;flex-direction:column;justify-content:space-between}
  .mono{font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace}
  .wm{display:inline-flex;align-items:center;gap:13px;font-size:26px;font-weight:700;letter-spacing:-.02em}
  .wm .mk{width:30px;height:30px;border-radius:9px;background:#3FCF5E;box-shadow:0 0 0 5px rgba(63,207,94,.15);display:grid;place-items:center}
  .wm .mk::after{content:"";width:11px;height:11px;background:#07140B;border-radius:3px}
  h1{font-size:66px;font-weight:700;line-height:1.05;letter-spacing:-.03em;max-width:16ch}
  h1 .g{color:#3FCF5E}
  .foot{display:flex;align-items:center;justify-content:space-between}
  .tag{font-size:19px;color:#9AA0A6}
  .tag b{color:#ECEEF0;font-weight:600}
  .chip{font-family:ui-monospace,monospace;font-size:15px;letter-spacing:.04em;color:#9AA0A6;border:1px solid #23261F;border-radius:100px;padding:9px 18px}
  /* faint form-card motif, top right */
  .mock{position:absolute;right:78px;top:150px;width:300px;border:1px solid #1E2329;border-radius:16px;background:#0D0F12;padding:22px;opacity:.9;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
  .mock .t{font-size:17px;font-weight:660;margin-bottom:14px}
  .mock .f{height:34px;border:1px solid #2A3036;border-radius:8px;background:#050607;margin-bottom:11px}
  .mock .b{height:36px;border-radius:8px;background:#3FCF5E;color:#07140B;display:grid;place-items:center;font-size:14px;font-weight:600}
  .dots{position:absolute;inset:0;pointer-events:none;
    background-image:radial-gradient(rgba(63,207,94,.12) 1.4px, transparent 1.4px);
    background-size:30px 30px;-webkit-mask:radial-gradient(60% 55% at 90% 12%,#000,transparent 70%);mask:radial-gradient(60% 55% at 90% 12%,#000,transparent 70%)}
</style>
<div class="og">
  <div class="dots"></div>
  <div class="mock">
    <div class="t">Join the waitlist</div>
    <div class="f"></div><div class="f"></div>
    <div class="b">Join</div>
  </div>
  <span class="wm"><span class="mk"></span>formweh</span>
  <h1>Open source forms, waitlists &amp; surveys, made easy to <span class="g">self-host</span>.</h1>
  <div class="foot">
    <div class="tag"><b>Yours to keep</b>, on your own site. No monthly bill.</div>
    <span class="chip">an aspatial tool</span>
  </div>
</div>
